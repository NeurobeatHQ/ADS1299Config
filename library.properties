sentence=Configuration library for boards with ADS1299 analog front-ends.
paragraph=Provides a fluent C++ API for configuring ADS1299 registers via a shadow register map. Supports up to 128 ADC chips (1024 channels) addressed via separate CS pins. Daisy chaining is supported for continuous data readback but not used for register configuration. Transport-agnostic (bring your own SPI driver).
